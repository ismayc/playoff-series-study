<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 483.65" role="img" aria-label="Two explanations for the Game 1 foul dip, and what each measurement says"><title>Two explanations for the Game 1 foul dip, and what each measurement says</title><defs><marker id="dg-arrow-28f9c94a62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><rect x="12" y="14" width="736" height="74" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="12" y="14" width="6" height="74" class="dg-f-nba" rx="3"/><text x="32" y="42" font-size="19" class="dg-f-ink dg-display" font-weight="600">The fact: Game 1 has the fewest fouls</text><text x="32" y="64.5" font-size="14" class="dg-f-ink2 dg-text">NBA games with listed officials: Game 1 runs −0.88 fouls per 100 possessions against the</text><text x="32" y="83.4" font-size="14" class="dg-f-ink2 dg-text">series average (337 series).</text><line x1="190" y1="92" x2="190" y2="117" stroke-width="1.5" class="dg-s-ink3"/><path d="M190.0,126.0 L185.0,117.0 L195.0,117.0 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="12" y="132" width="356" height="269.85" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="12" y="132" width="6" height="269.85" class="dg-f-ink3" rx="3"/><text x="32" y="162" font-size="16" class="dg-f-ink dg-text" font-weight="700">A. Lighter-whistling crews get Game</text><text x="32" y="183.6" font-size="16" class="dg-f-ink dg-text" font-weight="700">1s?</text><text x="32" y="210.5" font-size="14" class="dg-f-ink2 dg-text">Each crew&#x27;s usual foul level, from its</text><text x="32" y="229.4" font-size="14" class="dg-f-ink2 dg-text">other games: the Game 1 crew against the</text><text x="32" y="248.3" font-size="14" class="dg-f-ink2 dg-text">series&#x27; other crews.</text><text x="32" y="293.3" font-size="27" class="dg-f-ink dg-text" font-weight="700">+0.00</text><text x="32" y="315.7" font-size="14" class="dg-f-ink3 dg-text">(−0.03 to +0.03, 314 series; WNBA +0.00)</text><text x="32" y="344.7" font-size="15" class="dg-f-ink dg-text" font-weight="600">No: Game 1s get ordinary crews.</text><line x1="570" y1="92" x2="570" y2="117" stroke-width="1.5" class="dg-s-ink3"/><path d="M570.0,126.0 L565.0,117.0 L575.0,117.0 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="392" y="132" width="356" height="269.85" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="392" y="132" width="6" height="269.85" class="dg-f-c3" rx="3"/><text x="412" y="162" font-size="16" class="dg-f-ink dg-text" font-weight="700">B. The same officials call Game 1s</text><text x="412" y="183.6" font-size="16" class="dg-f-ink dg-text" font-weight="700">lighter?</text><text x="412" y="210.5" font-size="14" class="dg-f-ink2 dg-text">Each official&#x27;s fouls per 100 possessions</text><text x="412" y="229.4" font-size="14" class="dg-f-ink2 dg-text">in their Game 1s against their own later</text><text x="412" y="248.3" font-size="14" class="dg-f-ink2 dg-text">games.</text><text x="412" y="293.3" font-size="27" class="dg-f-c3 dg-text" font-weight="700">−1.15</text><text x="412" y="315.7" font-size="14" class="dg-f-ink3 dg-text">(−1.41 to −0.88, 63 officials; WNBA</text><text x="412" y="334.6" font-size="14" class="dg-f-ink3 dg-text">−1.63)</text><text x="412" y="363.6" font-size="15" class="dg-f-ink dg-text" font-weight="600">Yes: the dip is in how Game 1s are</text><text x="412" y="383.85" font-size="15" class="dg-f-ink dg-text" font-weight="600">called.</text><text x="12" y="431.85" font-size="14" class="dg-f-ink2 dg-text">Officials do differ from one another: an NBA official&#x27;s foul level in even-numbered seasons</text><text x="12" y="450.75" font-size="14" class="dg-f-ink2 dg-text">tracks their level in odd ones (r = +0.50). So crew assignment could have mattered; the data</text><text x="12" y="469.65" font-size="14" class="dg-f-ink2 dg-text">say it did not.</text></svg>
