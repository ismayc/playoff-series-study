<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 649" role="img" aria-label="Outshooting in Game 1 and winning the series"><title>Outshooting in Game 1 and winning the series</title><defs><marker id="dg-arrow-27b02facfc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><rect x="12" y="14" width="336" height="104" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="12" y="14" width="6" height="104" class="dg-f-nba" rx="3"/><text x="32" y="42" font-size="17" class="dg-f-ink dg-display" font-weight="600">614 NBA series</text><text x="32" y="61.5" font-size="13" class="dg-f-ink2 dg-text">Which team shot the better three-point</text><text x="32" y="79.05" font-size="13" class="dg-f-ink2 dg-text">percentage in Game 1? (16 more series had</text><text x="32" y="96.6" font-size="13" class="dg-f-ink2 dg-text">no better shooter and are left out.)</text><line x1="180" y1="122" x2="180" y2="147" stroke-width="1.5" class="dg-s-ink3"/><path d="M180.0,156.0 L175.0,147.0 L185.0,147.0 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="12" y="162" width="336" height="164.4" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="12" y="162" width="6" height="164.4" class="dg-f-c3" rx="3"/><text x="32" y="190" font-size="14" class="dg-f-ink dg-text" font-weight="700">It also won Game 1</text><text x="334" y="190" font-size="12" class="dg-f-ink3 dg-text" text-anchor="end">420 series</text><rect x="32" y="206" width="302" height="16" class="dg-f-rule" rx="3"/><rect x="32" y="206" width="231.533" height="16" class="dg-f-c3" rx="3"/><text x="32" y="256" font-size="23" class="dg-f-ink dg-text" font-weight="700">76.7%</text><text x="105.6" y="256" font-size="12" class="dg-f-ink2 dg-text">won by the better shooter</text><text x="32" y="284" font-size="12" class="dg-f-ink2 dg-text">Here the better shooter is the Game 1 winner.</text><line x1="180" y1="330.4" x2="180" y2="355.4" stroke-width="1.5" class="dg-s-ink3"/><path d="M180.0,364.4 L175.0,355.4 L185.0,355.4 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="12" y="370.4" width="336" height="164.4" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="12" y="370.4" width="6" height="164.4" class="dg-f-ink3" rx="3"/><text x="32" y="398.4" font-size="14" class="dg-f-ink dg-text" font-weight="700">It lost Game 1</text><text x="334" y="398.4" font-size="12" class="dg-f-ink3 dg-text" text-anchor="end">194 series</text><rect x="32" y="414.4" width="302" height="16" class="dg-f-rule" rx="3"/><rect x="32" y="414.4" width="70.0515" height="16" class="dg-f-ink3" rx="3"/><text x="32" y="464.4" font-size="23" class="dg-f-ink dg-text" font-weight="700">23.2%</text><text x="105.6" y="464.4" font-size="12" class="dg-f-ink2 dg-text">won by the better shooter</text><text x="32" y="492.4" font-size="12" class="dg-f-ink2 dg-text">The Game 1 winner, the worse shooter, took</text><text x="32" y="508.6" font-size="12" class="dg-f-ink2 dg-text">the other 76.8%.</text><text x="12" y="564.8" font-size="13" class="dg-f-ink2 dg-text">Together the better Game 1 shooter wins 59.8%</text><text x="12" y="582.35" font-size="13" class="dg-f-ink2 dg-text">of series. That share is mostly the Game 1</text><text x="12" y="599.9" font-size="13" class="dg-f-ink2 dg-text">result: the Game 1 winner takes about 77% of</text><text x="12" y="617.45" font-size="13" class="dg-f-ink2 dg-text">series whether or not it also outshot the</text><text x="12" y="635" font-size="13" class="dg-f-ink2 dg-text">other team.</text></svg>
