<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 404.3" role="img" aria-label="Outshooting in Game 1 and winning the series"><title>Outshooting in Game 1 and winning the series</title><defs><marker id="dg-arrow-bd1234a6c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><rect x="12" y="14" width="736" height="92" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="12" y="14" width="6" height="92" class="dg-f-nba" rx="3"/><text x="32" y="42" font-size="19" class="dg-f-ink dg-display" font-weight="600">614 NBA series</text><text x="32" y="64.5" font-size="15" class="dg-f-ink2 dg-text">Which team shot the better three-point percentage in Game 1? (16 more series had no</text><text x="32" y="84.75" font-size="15" class="dg-f-ink2 dg-text">better shooter and are left out.)</text><line x1="190" y1="110" x2="190" y2="135" stroke-width="1.5" class="dg-s-ink3"/><path d="M190.0,144.0 L185.0,135.0 L195.0,135.0 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="12" y="150" width="356" height="169.8" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="12" y="150" width="6" height="169.8" class="dg-f-c3" rx="3"/><text x="32" y="178" font-size="16" class="dg-f-ink dg-text" font-weight="700">It also won Game 1</text><text x="354" y="178" font-size="14" class="dg-f-ink3 dg-text" text-anchor="end">420 series</text><rect x="32" y="194" width="322" height="16" class="dg-f-rule" rx="3"/><rect x="32" y="194" width="246.867" height="16" class="dg-f-c3" rx="3"/><text x="32" y="244" font-size="25" class="dg-f-ink dg-text" font-weight="700">76.7%</text><text x="112" y="244" font-size="14" class="dg-f-ink2 dg-text">won by the better shooter</text><text x="32" y="272" font-size="14" class="dg-f-ink2 dg-text">Here the better shooter is the Game 1</text><text x="32" y="290.9" font-size="14" class="dg-f-ink2 dg-text">winner.</text><line x1="570" y1="110" x2="570" y2="135" stroke-width="1.5" class="dg-s-ink3"/><path d="M570.0,144.0 L565.0,135.0 L575.0,135.0 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="392" y="150" width="356" height="169.8" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="392" y="150" width="6" height="169.8" class="dg-f-ink3" rx="3"/><text x="412" y="178" font-size="16" class="dg-f-ink dg-text" font-weight="700">It lost Game 1</text><text x="734" y="178" font-size="14" class="dg-f-ink3 dg-text" text-anchor="end">194 series</text><rect x="412" y="194" width="322" height="16" class="dg-f-rule" rx="3"/><rect x="412" y="194" width="74.6907" height="16" class="dg-f-ink3" rx="3"/><text x="412" y="244" font-size="25" class="dg-f-ink dg-text" font-weight="700">23.2%</text><text x="492" y="244" font-size="14" class="dg-f-ink2 dg-text">won by the better shooter</text><text x="412" y="272" font-size="14" class="dg-f-ink2 dg-text">The Game 1 winner, the worse shooter,</text><text x="412" y="290.9" font-size="14" class="dg-f-ink2 dg-text">took the other 76.8%.</text><text x="12" y="349.8" font-size="15" class="dg-f-ink2 dg-text">Together the better Game 1 shooter wins 59.8% of series. That share is mostly the Game 1</text><text x="12" y="370.05" font-size="15" class="dg-f-ink2 dg-text">result: the Game 1 winner takes about 77% of series whether or not it also outshot the</text><text x="12" y="390.3" font-size="15" class="dg-f-ink2 dg-text">other team.</text></svg>
