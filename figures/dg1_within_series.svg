<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 452.3" role="img" aria-label="Why every comparison stays inside one series"><title>Why every comparison stays inside one series</title><defs><marker id="dg-arrow-ed53a5e5a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="20" class="dg-f-ink dg-display" font-weight="600">1. Later games come from fewer series</text><text x="12" y="52" font-size="14" class="dg-f-ink2 dg-text">NBA series since 1984-85. The blue</text><text x="12" y="70.9" font-size="14" class="dg-f-ink2 dg-text">band is the series still going at each</text><text x="12" y="89.8" font-size="14" class="dg-f-ink2 dg-text">game; the gray piece peels off the</text><text x="12" y="108.7" font-size="14" class="dg-f-ink2 dg-text">series that ended in that game.</text><text x="12" y="149.3" font-size="14" class="dg-f-ink dg-text" font-weight="700">G1</text><rect x="42" y="134.7" width="156" height="22" class="dg-f-nba" opacity="1.0"/><rect x="42" y="156.7" width="156" height="8" class="dg-f-nba" opacity="0.35"/><text x="48" y="149.3" font-size="14" class="dg-f-surface dg-text" font-weight="700">630</text><text x="12" y="179.3" font-size="14" class="dg-f-ink dg-text">G2</text><rect x="42" y="164.7" width="156" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="186.7" width="156" height="8" class="dg-f-nba" opacity="0.35"/><text x="12" y="209.3" font-size="14" class="dg-f-ink dg-text">G3</text><rect x="42" y="194.7" width="144.362" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="216.7" width="144.362" height="8" class="dg-f-nba" opacity="0.35"/><rect x="186.362" y="194.7" width="11.6381" height="22" class="dg-f-ink3" opacity="0.8"/><path d="M198.0,205.7 L212.0,205.7" stroke-width="1.5" class="dg-f-none dg-s-ink3" stroke-dasharray="2 3"/><text x="216" y="209.3" font-size="14" class="dg-f-ink2 dg-text">47 ended in G3</text><text x="12" y="239.3" font-size="14" class="dg-f-ink dg-text">G4</text><rect x="42" y="224.7" width="110.933" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="246.7" width="110.933" height="8" class="dg-f-nba" opacity="0.35"/><rect x="152.933" y="224.7" width="33.4286" height="22" class="dg-f-ink3" opacity="0.8"/><path d="M186.4,235.7 L212.0,235.7" stroke-width="1.5" class="dg-f-none dg-s-ink3" stroke-dasharray="2 3"/><text x="216" y="239.3" font-size="14" class="dg-f-ink2 dg-text">135 ended in G4</text><text x="12" y="269.3" font-size="14" class="dg-f-ink dg-text">G5</text><rect x="42" y="254.7" width="65.8667" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="276.7" width="65.8667" height="8" class="dg-f-nba" opacity="0.35"/><rect x="107.867" y="254.7" width="45.0667" height="22" class="dg-f-ink3" opacity="0.8"/><path d="M152.9,265.7 L212.0,265.7" stroke-width="1.5" class="dg-f-none dg-s-ink3" stroke-dasharray="2 3"/><text x="216" y="269.3" font-size="14" class="dg-f-ink2 dg-text">182 ended in G5</text><text x="12" y="299.3" font-size="14" class="dg-f-ink dg-text">G6</text><rect x="42" y="284.7" width="26.9905" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="306.7" width="26.9905" height="8" class="dg-f-nba" opacity="0.35"/><rect x="68.9905" y="284.7" width="38.8762" height="22" class="dg-f-ink3" opacity="0.8"/><path d="M107.9,295.7 L212.0,295.7" stroke-width="1.5" class="dg-f-none dg-s-ink3" stroke-dasharray="2 3"/><text x="216" y="299.3" font-size="14" class="dg-f-ink2 dg-text">157 ended in G6</text><text x="12" y="329.3" font-size="14" class="dg-f-ink dg-text">G7</text><rect x="42" y="314.7" width="0" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="314.7" width="26.9905" height="22" class="dg-f-ink3" opacity="0.8"/><path d="M69.0,325.7 L212.0,325.7" stroke-width="1.5" class="dg-f-none dg-s-ink3" stroke-dasharray="2 3"/><text x="216" y="329.3" font-size="14" class="dg-f-ink2 dg-text">109 played a G7</text><text x="12" y="360.7" font-size="14" class="dg-f-ink2 dg-text">Every series has a Game 1, but only</text><text x="12" y="379.6" font-size="14" class="dg-f-ink2 dg-text">109 of 630 reach a Game 7, and those</text><text x="12" y="398.5" font-size="14" class="dg-f-ink2 dg-text">are the close ones. A league-wide Game</text><text x="12" y="417.4" font-size="14" class="dg-f-ink2 dg-text">1 against Game 7 would compare</text><text x="12" y="436.3" font-size="14" class="dg-f-ink2 dg-text">different series.</text><text x="352" y="28" font-size="20" class="dg-f-ink dg-display" font-weight="600">2. Compare each series with itself</text><text x="352" y="52" font-size="14" class="dg-f-ink2 dg-text">Both teams&#x27; made and attempted threes, pooled:</text><rect x="354" y="74" width="51.1429" height="34" class="dg-f-nba" rx="4" opacity="1.0"/><text x="379.571" y="96" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G1</text><rect x="419.143" y="74" width="51.1429" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="444.714" y="96" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G2</text><rect x="474.286" y="74" width="51.1429" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="499.857" y="96" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G3</text><rect x="529.429" y="74" width="51.1429" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="555" y="96" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G4</text><rect x="584.571" y="74" width="51.1429" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="610.143" y="96" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G5</text><rect x="639.714" y="74" width="51.1429" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="665.286" y="96" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G6</text><rect x="694.857" y="74" width="51.1429" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="720.429" y="96" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G7</text><text x="352" y="130" font-size="15" class="dg-f-ink dg-text" font-weight="700">Game 1 against Games 2 on</text><text x="352" y="150.25" font-size="14" class="dg-f-ink2 dg-text">Game 1&#x27;s three-point percentage minus the rest of</text><text x="352" y="169.15" font-size="14" class="dg-f-ink2 dg-text">the series&#x27;, then averaged over 630 series.</text><text x="352" y="193.15" font-size="16" class="dg-f-nba dg-text" font-weight="700">−0.03 points (−0.87 to +0.82)</text><rect x="354" y="225.15" width="51.1429" height="34" class="dg-f-nba" rx="4" opacity="1.0"/><text x="379.571" y="247.15" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G1</text><rect x="419.143" y="225.15" width="51.1429" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="444.714" y="247.15" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G2</text><rect x="474.286" y="225.15" width="51.1429" height="34" class="dg-f-surface2 dg-s-rule" rx="4" opacity="1.0" stroke-dasharray="3 3" stroke-width="1.5"/><text x="499.857" y="247.15" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle" font-weight="700">G3</text><rect x="529.429" y="225.15" width="51.1429" height="34" class="dg-f-surface2 dg-s-rule" rx="4" opacity="1.0" stroke-dasharray="3 3" stroke-width="1.5"/><text x="555" y="247.15" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle" font-weight="700">G4</text><rect x="584.571" y="225.15" width="51.1429" height="34" class="dg-f-surface2 dg-s-rule" rx="4" opacity="1.0" stroke-dasharray="3 3" stroke-width="1.5"/><text x="610.143" y="247.15" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle" font-weight="700">G5</text><rect x="639.714" y="225.15" width="51.1429" height="34" class="dg-f-surface2 dg-s-rule" rx="4" opacity="1.0" stroke-dasharray="3 3" stroke-width="1.5"/><text x="665.286" y="247.15" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle" font-weight="700">G6</text><rect x="694.857" y="225.15" width="51.1429" height="34" class="dg-f-surface2 dg-s-rule" rx="4" opacity="1.0" stroke-dasharray="3 3" stroke-width="1.5"/><text x="720.429" y="247.15" font-size="14" class="dg-f-ink3 dg-text" text-anchor="middle" font-weight="700">G7</text><text x="352" y="281.15" font-size="15" class="dg-f-ink dg-text" font-weight="700">Game 1 against Game 2 alone</text><text x="352" y="301.4" font-size="14" class="dg-f-ink2 dg-text">Every series has a Game 2, so this check has no</text><text x="352" y="320.3" font-size="14" class="dg-f-ink2 dg-text">close-series tilt.</text><text x="352" y="344.3" font-size="16" class="dg-f-nba dg-text" font-weight="700">−0.32 points (−1.36 to +0.73)</text><text x="352" y="376.3" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">Counting every NBA three together instead: Game 1s</text><text x="352" y="395.2" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">hit 35.11%, later games 34.83%.</text></svg>
