<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 693.1" role="img" aria-label="Two explanations for the Game 1 foul dip, and what each measurement says"><title>Two explanations for the Game 1 foul dip, and what each measurement says</title><defs><marker id="dg-arrow-8e8787a6ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><rect x="12" y="14" width="336" height="92" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="12" y="14" width="6" height="92" class="dg-f-nba" rx="3"/><text x="32" y="42" font-size="17" class="dg-f-ink dg-display" font-weight="600">The fact: Game 1 has the fewest fouls</text><text x="32" y="61.5" font-size="12" class="dg-f-ink2 dg-text">NBA games with listed officials: Game 1 runs</text><text x="32" y="77.7" font-size="12" class="dg-f-ink2 dg-text">−0.88 fouls per 100 possessions against the</text><text x="32" y="93.9" font-size="12" class="dg-f-ink2 dg-text">series average (337 series).</text><line x1="180" y1="110" x2="180" y2="135" stroke-width="1.5" class="dg-s-ink3"/><path d="M180.0,144.0 L175.0,135.0 L185.0,135.0 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="12" y="150" width="336" height="193.8" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="12" y="150" width="6" height="193.8" class="dg-f-ink3" rx="3"/><text x="32" y="180" font-size="14" class="dg-f-ink dg-text" font-weight="700">A. Lighter-whistling crews get Game 1s?</text><text x="32" y="204.2" font-size="12" class="dg-f-ink2 dg-text">Each crew&#x27;s usual foul level, from its other</text><text x="32" y="220.4" font-size="12" class="dg-f-ink2 dg-text">games: the Game 1 crew against the series&#x27;</text><text x="32" y="236.6" font-size="12" class="dg-f-ink2 dg-text">other crews.</text><text x="32" y="279.6" font-size="25" class="dg-f-ink dg-text" font-weight="700">+0.00</text><text x="32" y="298.8" font-size="12" class="dg-f-ink3 dg-text">(−0.03 to +0.03, 314 series; WNBA +0.00)</text><text x="32" y="325.8" font-size="13" class="dg-f-ink dg-text" font-weight="600">No: Game 1s get ordinary crews.</text><line x1="180" y1="347.8" x2="180" y2="372.8" stroke-width="1.5" class="dg-s-ink3"/><path d="M180.0,381.8 L175.0,372.8 L185.0,372.8 Z" stroke-width="1.5" class="dg-f-ink3"/><rect x="12" y="387.8" width="336" height="196.5" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><rect x="12" y="387.8" width="6" height="196.5" class="dg-f-c3" rx="3"/><text x="32" y="417.8" font-size="14" class="dg-f-ink dg-text" font-weight="700">B. The same officials call Game 1s</text><text x="32" y="436.7" font-size="14" class="dg-f-ink dg-text" font-weight="700">lighter?</text><text x="32" y="460.9" font-size="12" class="dg-f-ink2 dg-text">Each official&#x27;s fouls per 100 possessions in</text><text x="32" y="477.1" font-size="12" class="dg-f-ink2 dg-text">their Game 1s against their own later games.</text><text x="32" y="520.1" font-size="25" class="dg-f-c3 dg-text" font-weight="700">−1.15</text><text x="32" y="539.3" font-size="12" class="dg-f-ink3 dg-text">(−1.41 to −0.88, 63 officials; WNBA −1.63)</text><text x="32" y="566.3" font-size="13" class="dg-f-ink dg-text" font-weight="600">Yes: the dip is in how Game 1s are called.</text><text x="12" y="614.3" font-size="12" class="dg-f-ink2 dg-text">Officials do differ from one another: an NBA</text><text x="12" y="630.5" font-size="12" class="dg-f-ink2 dg-text">official&#x27;s foul level in even-numbered seasons</text><text x="12" y="646.7" font-size="12" class="dg-f-ink2 dg-text">tracks their level in odd ones (r = +0.50). So</text><text x="12" y="662.9" font-size="12" class="dg-f-ink2 dg-text">crew assignment could have mattered; the data say</text><text x="12" y="679.1" font-size="12" class="dg-f-ink2 dg-text">it did not.</text></svg>
