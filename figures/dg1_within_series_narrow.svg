<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 792.3" role="img" aria-label="Why every comparison stays inside one series"><title>Why every comparison stays inside one series</title><defs><marker id="dg-arrow-70a9ec8310" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="17" class="dg-f-ink dg-display" font-weight="600">1. Later games come from fewer series</text><text x="12" y="52" font-size="12" class="dg-f-ink2 dg-text">NBA series since 1984-85. The blue band is the</text><text x="12" y="68.2" font-size="12" class="dg-f-ink2 dg-text">series still going at each game; the gray piece</text><text x="12" y="84.4" font-size="12" class="dg-f-ink2 dg-text">peels off the series that ended in that game.</text><text x="12" y="125" font-size="12" class="dg-f-ink dg-text" font-weight="700">G1</text><rect x="42" y="110.4" width="174.72" height="22" class="dg-f-nba" opacity="1.0"/><rect x="42" y="132.4" width="174.72" height="8" class="dg-f-nba" opacity="0.35"/><text x="48" y="125" font-size="12" class="dg-f-surface dg-text" font-weight="700">630</text><text x="12" y="155" font-size="12" class="dg-f-ink dg-text">G2</text><rect x="42" y="140.4" width="174.72" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="162.4" width="174.72" height="8" class="dg-f-nba" opacity="0.35"/><text x="12" y="185" font-size="12" class="dg-f-ink dg-text">G3</text><rect x="42" y="170.4" width="161.685" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="192.4" width="161.685" height="8" class="dg-f-nba" opacity="0.35"/><rect x="203.685" y="170.4" width="13.0347" height="22" class="dg-f-ink3" opacity="0.8"/><path d="M216.7,181.4 L230.7,181.4" stroke-width="1.5" class="dg-f-none dg-s-ink3" stroke-dasharray="2 3"/><text x="234.72" y="185" font-size="12" class="dg-f-ink2 dg-text">47 ended in G3</text><text x="12" y="215" font-size="12" class="dg-f-ink dg-text">G4</text><rect x="42" y="200.4" width="124.245" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="222.4" width="124.245" height="8" class="dg-f-nba" opacity="0.35"/><rect x="166.245" y="200.4" width="37.44" height="22" class="dg-f-ink3" opacity="0.8"/><path d="M203.7,211.4 L230.7,211.4" stroke-width="1.5" class="dg-f-none dg-s-ink3" stroke-dasharray="2 3"/><text x="234.72" y="215" font-size="12" class="dg-f-ink2 dg-text">135 ended in G4</text><text x="12" y="245" font-size="12" class="dg-f-ink dg-text">G5</text><rect x="42" y="230.4" width="73.7707" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="252.4" width="73.7707" height="8" class="dg-f-nba" opacity="0.35"/><rect x="115.771" y="230.4" width="50.4747" height="22" class="dg-f-ink3" opacity="0.8"/><path d="M166.2,241.4 L230.7,241.4" stroke-width="1.5" class="dg-f-none dg-s-ink3" stroke-dasharray="2 3"/><text x="234.72" y="245" font-size="12" class="dg-f-ink2 dg-text">182 ended in G5</text><text x="12" y="275" font-size="12" class="dg-f-ink dg-text">G6</text><rect x="42" y="260.4" width="30.2293" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="282.4" width="30.2293" height="8" class="dg-f-nba" opacity="0.35"/><rect x="72.2293" y="260.4" width="43.5413" height="22" class="dg-f-ink3" opacity="0.8"/><path d="M115.8,271.4 L230.7,271.4" stroke-width="1.5" class="dg-f-none dg-s-ink3" stroke-dasharray="2 3"/><text x="234.72" y="275" font-size="12" class="dg-f-ink2 dg-text">157 ended in G6</text><text x="12" y="305" font-size="12" class="dg-f-ink dg-text">G7</text><rect x="42" y="290.4" width="0" height="22" class="dg-f-nba" opacity="0.75"/><rect x="42" y="290.4" width="30.2293" height="22" class="dg-f-ink3" opacity="0.8"/><path d="M72.2,301.4 L230.7,301.4" stroke-width="1.5" class="dg-f-none dg-s-ink3" stroke-dasharray="2 3"/><text x="234.72" y="305" font-size="12" class="dg-f-ink2 dg-text">109 played a G7</text><text x="12" y="336.4" font-size="12" class="dg-f-ink2 dg-text">Every series has a Game 1, but only 109 of 630</text><text x="12" y="352.6" font-size="12" class="dg-f-ink2 dg-text">reach a Game 7, and those are the close ones. A</text><text x="12" y="368.8" font-size="12" class="dg-f-ink2 dg-text">league-wide Game 1 against Game 7 would compare</text><text x="12" y="385" font-size="12" class="dg-f-ink2 dg-text">different series.</text><text x="12" y="429" font-size="17" class="dg-f-ink dg-display" font-weight="600">2. Compare each series with itself</text><text x="12" y="453" font-size="12" class="dg-f-ink2 dg-text">Both teams&#x27; made and attempted threes, pooled:</text><rect x="14" y="475" width="42.5714" height="34" class="dg-f-nba" rx="4" opacity="1.0"/><text x="35.2857" y="497" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G1</text><rect x="70.5714" y="475" width="42.5714" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="91.8571" y="497" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G2</text><rect x="117.143" y="475" width="42.5714" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="138.429" y="497" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G3</text><rect x="163.714" y="475" width="42.5714" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="185" y="497" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G4</text><rect x="210.286" y="475" width="42.5714" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="231.571" y="497" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G5</text><rect x="256.857" y="475" width="42.5714" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="278.143" y="497" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G6</text><rect x="303.429" y="475" width="42.5714" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="324.714" y="497" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G7</text><text x="12" y="531" font-size="13" class="dg-f-ink dg-text" font-weight="700">Game 1 against Games 2 on</text><text x="12" y="548.55" font-size="12" class="dg-f-ink2 dg-text">Game 1&#x27;s three-point percentage minus the rest of</text><text x="12" y="564.75" font-size="12" class="dg-f-ink2 dg-text">the series&#x27;, then averaged over 630 series.</text><text x="12" y="585.55" font-size="14" class="dg-f-nba dg-text" font-weight="700">−0.03 points (−0.87 to +0.82)</text><rect x="14" y="617.55" width="42.5714" height="34" class="dg-f-nba" rx="4" opacity="1.0"/><text x="35.2857" y="639.55" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G1</text><rect x="70.5714" y="617.55" width="42.5714" height="34" class="dg-f-c4" rx="4" opacity="0.9"/><text x="91.8571" y="639.55" font-size="12" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">G2</text><rect x="117.143" y="617.55" width="42.5714" height="34" class="dg-f-surface2 dg-s-rule" rx="4" opacity="1.0" stroke-dasharray="3 3" stroke-width="1.5"/><text x="138.429" y="639.55" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle" font-weight="700">G3</text><rect x="163.714" y="617.55" width="42.5714" height="34" class="dg-f-surface2 dg-s-rule" rx="4" opacity="1.0" stroke-dasharray="3 3" stroke-width="1.5"/><text x="185" y="639.55" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle" font-weight="700">G4</text><rect x="210.286" y="617.55" width="42.5714" height="34" class="dg-f-surface2 dg-s-rule" rx="4" opacity="1.0" stroke-dasharray="3 3" stroke-width="1.5"/><text x="231.571" y="639.55" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle" font-weight="700">G5</text><rect x="256.857" y="617.55" width="42.5714" height="34" class="dg-f-surface2 dg-s-rule" rx="4" opacity="1.0" stroke-dasharray="3 3" stroke-width="1.5"/><text x="278.143" y="639.55" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle" font-weight="700">G6</text><rect x="303.429" y="617.55" width="42.5714" height="34" class="dg-f-surface2 dg-s-rule" rx="4" opacity="1.0" stroke-dasharray="3 3" stroke-width="1.5"/><text x="324.714" y="639.55" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle" font-weight="700">G7</text><text x="12" y="673.55" font-size="13" class="dg-f-ink dg-text" font-weight="700">Game 1 against Game 2 alone</text><text x="12" y="691.1" font-size="12" class="dg-f-ink2 dg-text">Every series has a Game 2, so this check has no</text><text x="12" y="707.3" font-size="12" class="dg-f-ink2 dg-text">close-series tilt.</text><text x="12" y="728.1" font-size="14" class="dg-f-nba dg-text" font-weight="700">−0.32 points (−1.36 to +0.73)</text><text x="12" y="760.1" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">Counting every NBA three together instead: Game 1s</text><text x="12" y="776.3" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">hit 35.11%, later games 34.83%.</text></svg>
